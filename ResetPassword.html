<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#17324F; --navy-soft:#2B4A6B; --label:#8793A3; --border:#DCE3EC;
  --bg:#FFFFFF; --panel:#FBFCFD; --icon:#A9B9C9; --moss:#7A9471; --amber:#C89B5C;
  --text:#2B3A4A; --sub:#5B6B7D; --mk1:#7A9471; --mk2:#C89B5C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy:#EAF0F7; --navy-soft:#C9D8E6; --label:#92A0B2; --border:#2C3C4E;
    --bg:#101823; --panel:#141E2B; --icon:#5E7187; --text:#E4EAF1; --sub:#AEBBCA; --mk1:#9CB79A; --mk2:#D9B77C;
  }
}
:root[data-theme="dark"] {
  --navy:#EAF0F7; --navy-soft:#C9D8E6; --label:#92A0B2; --border:#2C3C4E;
  --bg:#101823; --panel:#141E2B; --icon:#5E7187; --text:#E4EAF1; --sub:#AEBBCA; --mk1:#9CB79A; --mk2:#D9B77C;
}
* { box-sizing:border-box; }
html { scroll-padding-top:env(safe-area-inset-top,0px); }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Source Sans 3',Arial,sans-serif; line-height:1.55;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
a { color:inherit; }
.wrap { max-width:1120px; margin:0 auto; padding:0 24px; }
header { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--border); }
header .wrap { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-top:14px; padding-bottom:14px; }
.brand { font-family:'Source Serif 4',Georgia,serif; font-weight:700; font-size:22px; text-decoration:none; color:var(--navy); }
.brand { display:inline-flex; align-items:center; gap:9px; }
.brand .ai { color:var(--moss); }
.auth-head .mark { display:block; margin:0 auto 14px; }
nav { display:flex; gap:22px; flex-wrap:wrap; font-size:14px; }
nav a { text-decoration:none; color:var(--sub); padding:4px 0; border-bottom:2px solid transparent; }
nav a.on { color:var(--navy); border-bottom-color:var(--amber); }

h1,h2,h3 { font-family:'Source Serif 4',Georgia,serif; font-weight:700; color:var(--navy); margin:0; letter-spacing:-0.01em; }
h1 { font-size:clamp(28px,4.4vw,38px); line-height:1.15; }
.lede { font-size:clamp(15px,1.8vw,17px); color:var(--sub); margin:12px 0 0; text-wrap:balance; }
.kicker { color:var(--label); font-weight:600; font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase; margin-bottom:10px; }

.auth-wrap { padding:64px 0 80px; display:flex; justify-content:center; }
.auth-card { width:100%; max-width:440px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:36px 32px; }
.auth-head { text-align:center; margin-bottom:28px; }

.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:12px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--label); margin-bottom:6px; }
.form-group input {
  width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); font-family:'Source Sans 3',Arial,sans-serif; font-size:15px;
}
.form-group input:focus { outline:none; border-color:var(--moss); }
.hint { font-size:12.5px; color:var(--sub); margin:6px 0 0; }

.btn-row { display:flex; gap:12px; margin-top:24px; }
.btn { flex:1; display:inline-block; text-align:center; background:var(--amber); color:#17324F; font-weight:700; text-decoration:none; padding:12px 22px; border-radius:8px; font-family:inherit; font-size:15px; border:1px solid transparent; cursor:pointer; }
.btn-secondary { background:transparent; color:var(--navy); border-color:var(--border); }
.btn[disabled] { opacity:0.6; cursor:default; }

.form-error { display:none; background:#FBEAEA; border:1px solid #E3B8B8; color:#A23B3B; font-size:13.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
.form-success { display:none; background:#EAF3E7; border:1px solid #BCD3B4; color:#3C6B35; font-size:13.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .form-error { background:#3A1F22; border-color:#6B3236; color:#E7A8A8; }
  :root:not([data-theme="light"]) .form-success { background:#1F2F20; border-color:#3C5A3A; color:#A9D1A1; }
}
:root[data-theme="dark"] .form-error { background:#3A1F22; border-color:#6B3236; color:#E7A8A8; }
:root[data-theme="dark"] .form-success { background:#1F2F20; border-color:#3C5A3A; color:#A9D1A1; }

footer { border-top:1px solid var(--border); padding:30px 0 40px; color:var(--sub); font-size:14px; }
footer .wrap { display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; }
footer b { color:var(--navy); }
</style>

<style id="dynamic-active-tab">
nav a.active, .nav a.active, header a.active {
  text-decoration: underline !important;
  text-decoration-thickness: 2px !important;
  text-underline-offset: 6px !important;
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html"><svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:30px;height:30px">
  <path d="M20 4L33 9V19C33 27.5 27.5 33.5 20 36.5C12.5 33.5 7 27.5 7 19V9Z" style="stroke:var(--mk1)" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M13 20.5L18 25.5L27.5 14" style="stroke:var(--mk2)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="13" cy="20.5" r="1.6" style="fill:var(--mk2)"/><circle cx="27.5" cy="14" r="1.6" style="fill:var(--mk2)"/>
  <path d="M18 25.5V30" style="stroke:var(--mk1)" stroke-width="1.6" stroke-linecap="round"/><circle cx="18" cy="30.5" r="1.2" style="fill:var(--mk1)"/>
</svg><span>br<span class="ai">AI</span>ght</span></a>
    <nav>
      <a href="index.html#/schools">Schools &amp; Students</a>
      <a href="index.html#/freshers">Freshers &amp; Job Seekers</a>
      <a href="insights.html">Data Insights</a>
      <a href="Login.html">Login</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-head">
          <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:44px;height:44px">
  <path d="M20 4L33 9V19C33 27.5 27.5 33.5 20 36.5C12.5 33.5 7 27.5 7 19V9Z" style="stroke:var(--mk1)" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M13 20.5L18 25.5L27.5 14" style="stroke:var(--mk2)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="13" cy="20.5" r="1.6" style="fill:var(--mk2)"/><circle cx="27.5" cy="14" r="1.6" style="fill:var(--mk2)"/>
  <path d="M18 25.5V30" style="stroke:var(--mk1)" stroke-width="1.6" stroke-linecap="round"/><circle cx="18" cy="30.5" r="1.2" style="fill:var(--mk1)"/>
</svg>
          <div class="kicker">Account</div>
          <h1>Reset your password</h1>
          <p class="lede">Enter your current password to choose a new one.</p>
        </div>

        <form id="reset-form">
          <div id="reset-error" class="form-error" role="alert"></div>
          <div id="reset-success" class="form-success" role="status"></div>

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="old-password">Old Password</label>
            <input type="password" id="old-password" name="oldPassword" autocomplete="current-password" required>
          </div>
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="newPassword" autocomplete="new-password" required>
            <p class="hint">At least 8 characters.</p>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" required>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn" id="reset-ok">OK</button>
            <a href="Login.html" class="btn btn-secondary" id="reset-cancel">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">
    <div><b>br<span class="ai" style="color:var(--moss)">AI</span>ght</b><br>Safe, smart AI for teens</div>
    <div>sagikraju@braight.in<br>+91 99084 20198 &middot; Hyderabad, India</div>
  </div>
</footer>

<script>
// Address of the backend API (same one Login.html and NewUser.html use).
const API_BASE = "https://braight-backend.onrender.com";

const form = document.getElementById('reset-form');
const errorBox = document.getElementById('reset-error');
const successBox = document.getElementById('reset-success');
const okBtn = document.getElementById('reset-ok');

function showError(message) {
  successBox.style.display = 'none';
  errorBox.textContent = message;
  errorBox.style.display = 'block';
}

function resetOkButton() {
  okBtn.disabled = false;
  okBtn.textContent = 'OK';
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  errorBox.style.display = 'none';
  successBox.style.display = 'none';

  const username = document.getElementById('username').value.trim();
  const oldPassword = document.getElementById('old-password').value;
  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;

  if (newPassword.length < 8) {
    showError('New password must be at least 8 characters.');
    return;
  }
  if (newPassword !== confirmPassword) {
    showError('New password and confirmation do not match.');
    return;
  }
  if (newPassword === oldPassword) {
    showError('New password must be different from your old password.');
    return;
  }

  okBtn.disabled = true;
  okBtn.textContent = 'Updating\u2026';

  try {
    const res = await fetch(API_BASE + '/api/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, oldPassword: oldPassword, newPassword: newPassword }),
    });

    let data = null;
    try { data = await res.json(); } catch (_) { /* response wasn't JSON */ }

    if (!res.ok) {
      showError(
        (data && data.error) ||
        'The server returned an unexpected response (status ' + res.status + '). The backend may need to be updated.'
      );
      resetOkButton();
      return;
    }

    form.reset();
    successBox.textContent = 'Password changed. Taking you to the login page\u2026';
    successBox.style.display = 'block';
    setTimeout(function () { window.location.href = 'Login.html'; }, 2000);
  } catch (err) {
    showError('Could not reach the server. Is the backend running?');
    resetOkButton();
  }
});
</script>
<script>
(function(){
  const path=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  document.querySelectorAll('nav a, .nav a, header a').forEach(a=>{
    const href=(a.getAttribute('href')||'').split('#')[0].split('?')[0].toLowerCase();
    if(!href || href.startsWith('http')) return;
    const target=href.split('/').pop()||'index.html';
    const isHome=(path==='index.html'||path==='')&&(target==='index.html');
    const isMatch=target===path || (path==='sdg.html'&&target==='sdg.html');
    a.classList.toggle('active',isHome||isMatch);
    a.setAttribute('aria-current',(isHome||isMatch)?'page':'false');
  });
})();
</script>
</body>
</html>
